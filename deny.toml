# cargo-deny policy: licenses compatible with MIT OR Apache-2.0 distribution,
# no known-vulnerable or yanked crates, crates.io only.
[graph]
all-features = false

[advisories]
yanked = "deny"
# Every exception below is scoped to the Wasmtime 45.x pulled in by yara-x
# 1.21.0 (the latest release, 17 Oct 2026). Triage is recorded in
# docs/reports/phase-0.md. EXIT CONDITION: remove all of these as soon as a
# yara-x release depends on Wasmtime >= 48.0.6, which fixes every one.
# Rift uses a single Engine, synchronous calls, no component model, no
# async, no wasmtime-wasi; the wasm is generated by yara-x from signed rules.
ignore = [
  { id = "RUSTSEC-2026-0222", reason = "needs two Engines mixed by the embedder; yara-x uses one" },
  { id = "RUSTSEC-2026-0269", reason = "wasmtime-wasi filesystem; wasmtime-wasi is not in the dependency tree" },
  { id = "RUSTSEC-2026-0316", reason = "component-model Val API; component model not compiled in" },
  { id = "RUSTSEC-2026-0327", reason = "component-model-async callbacks; component model not compiled in" },
  { id = "RUSTSEC-2026-0359", reason = "guest-defined recursive type chain; guest wasm is generated by yara-x, and a crash is contained in the confined worker and reported as not fully scanned" },
  { id = "RUSTSEC-2026-0362", reason = "async/sync call mixing; Rift makes synchronous calls only, async not compiled in" },
  { id = "RUSTSEC-2026-0363", reason = "component-model resource handles; component model not compiled in" },
  { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, not vulnerable; used by yara-x for rule serialization, and Rift never deserializes untrusted bincode (rules are compiled from verified source)" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# Mozilla's CA root list as data, used by rift-core's downloads (rustls).
# A permissive data licence; distributing it requires shipping its text,
# which the release notices must include (Phase 7).
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace path dependencies are unpublished (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
