[package]
name = "rift-worker"
version = "0.1.0"
description = "Simulation-Rift confined worker: parses untrusted content and answers via rift-protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Pure-Rust decoders only; no rayon (workers may not create threads).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rift-protocol = { path = "../rift-protocol" }
sha2 = "0.11.1"
# Interpreted (Pulley) rule execution: workers never need executable memory.
yara-x = { version = "1.21.0", default-features = false, features = [
    "pulley",
    "constant-folding",
    "exact-atoms",
    "fast-regexp",
    "hash-module",
    "math-module",
    "string-module",
] }
