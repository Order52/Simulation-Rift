[package]
name = "rift-core"
version = "0.1.0"
description = "Simulation-Rift trusted core: policy, sessions, storage, intelligence"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
age = { version = "=0.12.1", default-features = false } # pre-1.0: pinned exactly
getrandom = "0.4.3"
hex = "0.4.3"
idna = "1.1.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-security = "0.1.2"
# TLS with rustls' aws-lc-rs provider, which tough already needs; ureq's
# `rustls` feature would add ring as a second crypto library.
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
url = "2.5.8"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[[example]]
name = "x3_lookup_bench"
