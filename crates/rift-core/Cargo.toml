[package]
name = "rift-core"
version = "0.1.0"
description = "Simulation-Rift trusted core: policy, sessions, storage, intelligence"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
age = { version = "=0.12.1", default-features = false } # pre-1.0: pinned exactly
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
idna = "1.1.0"
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-security = "0.1.2"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.8"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[[example]]
name = "x3_lookup_bench"
