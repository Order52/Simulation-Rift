[package]
name = "rift-ffi"
version = "0.1.0"
description = "Rift UniFFI bindings: the Android controller's interface to rift-core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib for the app; lib so the host tests and the bindgen binary can link it.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[features]
# Builds the uniffi-bindgen binary that generates the Kotlin bindings from the
# compiled library. Never enabled for the library that ships.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[dependencies]
hex = "0.4.3"
rift-core = { path = "../rift-core" }
rift-protocol = { path = "../rift-protocol" }
rift-update = { path = "../rift-update" }
thiserror = "2.0.21"
uniffi = "0.32.2"

[dev-dependencies]
jiff = "0.2.38"
rift-pack = { path = "../../tools/rift-pack" }
rift-worker-ffi = { path = "../rift-worker-ffi" }
tempfile = "3.27.0"
