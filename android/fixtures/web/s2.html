<!doctype html><html data-test="s2"><meta charset="utf-8"><title>S2 permissions</title>
<script src="/report.js"></script>
<script>
// S2: a page asks the engine itself for camera, microphone, location and the
// clipboard, from a frame it makes, where Rift's decoys (D1) are not.
const settle = p => p.then(() => "ALLOWED", e => "DENIED " + (e && (e.name || e.code)));
(async () => {
  await report("secure_context", window.isSecureContext);
  const frame = document.createElement("iframe");
  document.documentElement.appendChild(frame);
  const engine = frame.contentWindow.navigator;
  const media = engine.mediaDevices && engine.mediaDevices.getUserMedia;
  await report("camera", media ? await settle(engine.mediaDevices.getUserMedia({ video: true })) : "UNAVAILABLE");
  await report("microphone", media ? await settle(engine.mediaDevices.getUserMedia({ audio: true })) : "UNAVAILABLE");
  await report("geolocation", await new Promise(resolve => engine.geolocation.getCurrentPosition(
    () => resolve("ALLOWED"), e => resolve("DENIED code=" + e.code), { timeout: 5000 })));
  await report("clipboard_read", engine.clipboard && engine.clipboard.readText
    ? await settle(engine.clipboard.readText()) : "UNAVAILABLE");
  await report("file_fetch", await settle(fetch("file:///etc/hosts")));
  await report("content_fetch", await settle(fetch("content://settings/system")));
  const popup = window.open("/s2.html#popup");
  await report("window_open", popup ? "OPENED" : "BLOCKED");
  await report("done", "1");
})();
</script>
