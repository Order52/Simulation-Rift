<!doctype html><html data-test="d2"><meta charset="utf-8"><title>D2 fingerprinting</title>
<meta name="viewport" content="width=device-width">
<script src="/report.js"></script>
<body>
<!-- D2: what a fingerprinting script does (canvas, WebGL, audio, fonts), and the hashes it would keep. -->
<p>Fingerprinting test page.</p>
<script>
const hash = async data => {
  const bytes = typeof data === "string" ? new TextEncoder().encode(data) : new Uint8Array(data.buffer || data);
  const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
  return Array.from(digest.slice(0, 8), b => b.toString(16).padStart(2, "0")).join("");
};
(async () => {
  // Canvas: text and shapes drawn out of sight, read back.
  const canvas = document.createElement("canvas");
  canvas.width = 240; canvas.height = 60;
  const c = canvas.getContext("2d");
  c.textBaseline = "top"; c.font = "16px Arial"; c.fillStyle = "#f60"; c.fillRect(100, 1, 62, 20);
  c.fillStyle = "#069"; c.fillText("Cwm fjordbank glyphs vext quiz, 😃", 2, 15);
  c.fillStyle = "rgba(102, 204, 0, 0.7)"; c.fillText("Cwm fjordbank glyphs vext quiz", 4, 17);
  const url = canvas.toDataURL();
  await report("canvas_png", url.startsWith("data:image/png;base64,"));
  await report("canvas", await hash(url));
  await report("canvas_again", await hash(canvas.toDataURL()));
  await report("canvas_pixels", await hash(c.getImageData(0, 0, 240, 60).data));
  await report("looks_native", String(canvas.toDataURL).includes("[native code]"));
  // WebGL: the graphics chip's name.
  const gl = document.createElement("canvas").getContext("webgl");
  const info = gl && gl.getExtension("WEBGL_debug_renderer_info");
  await report("webgl", gl ? (info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : "NO-EXTENSION") : "UNAVAILABLE");
  // Audio: an oscillator through a compressor, rendered off screen.
  const audio = new OfflineAudioContext(1, 5000, 44100);
  const oscillator = audio.createOscillator();
  oscillator.type = "triangle"; oscillator.frequency.value = 10000;
  const compressor = audio.createDynamicsCompressor();
  oscillator.connect(compressor); compressor.connect(audio.destination); oscillator.start(0);
  const rendered = await audio.startRendering();
  const samples = rendered.getChannelData(0);
  let sum = 0;
  for (let i = 4500; i < 5000; i++) sum += Math.abs(samples[i]);
  await report("audio", sum.toPrecision(15));
  // Fonts: text measured in many fonts.
  const widths = [];
  for (const font of ["Arial", "Courier", "Georgia", "Helvetica", "Impact", "Roboto", "Noto Sans", "Verdana", "Tahoma", "Times",
    "Trebuchet MS", "Palatino", "Garamond", "Comic Sans MS", "Lucida", "Monaco", "Consolas", "Menlo", "Ubuntu", "Cantarell",
    "Droid Sans", "Segoe UI", "Calibri", "Cambria", "Futura"]) {
    c.font = `20px "${font}", monospace`;
    widths.push(c.measureText("mmmmmmmmmmlli").width);
  }
  await report("fonts", widths.length);
  await report("done", "1");
})().catch(e => report("probe_error", e && (e.stack || e)));
</script>
