<!doctype html><html data-test="d1"><meta charset="utf-8"><title>D1 decoys</title>
<meta name="viewport" content="width=device-width">
<script src="/report.js"></script>
<body>
<!-- D1: a page asks for everything a decoy answers, and reports what it got. A file chooser needs a tap. -->
<button id="upload" style="font-size:28px;width:100%;height:120px" onclick="document.getElementById('file').click()">Upload a photo</button>
<input type="file" id="file" accept="image/*" style="display:none">
<script>
document.getElementById("file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return report("file", "NONE");
  const head = new Uint8Array(await f.slice(0, 3).arrayBuffer());
  await report("file", `${f.name} ${f.size} ${f.type} jpeg=${head[0] === 0xff && head[1] === 0xd8}`);
});
const settle = p => p.then(v => v, e => "ERROR " + (e && (e.name || e.message)));
(async () => {
  // Camera and microphone: a stream with live tracks and frames.
  const stream = await settle(navigator.mediaDevices.getUserMedia({ video: true, audio: true }));
  if (typeof stream === "string") await report("media", stream);
  else {
    const video = stream.getVideoTracks()[0], audio = stream.getAudioTracks()[0];
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.srcObject = stream;
    await v.play().catch(() => {});
    await new Promise(r => setTimeout(r, 1500));
    await report("media", `video=${video && video.readyState} audio=${audio && audio.readyState} label=${video && video.label} size=${v.videoWidth}x${v.videoHeight}`);
    stream.getTracks().forEach(t => t.stop());
  }
  const devices = await settle(navigator.mediaDevices.enumerateDevices());
  await report("devices", typeof devices === "string" ? devices : devices.map(d => d.kind + (d.label ? ":" + d.label : "")).join(","));
  // Location.
  await report("geolocation", await new Promise(resolve => navigator.geolocation.getCurrentPosition(
    p => resolve(`ALLOWED ${p.coords.latitude.toFixed(2)},${p.coords.longitude.toFixed(2)} acc=${Math.round(p.coords.accuracy)}`),
    e => resolve("DENIED code=" + e.code), { timeout: 5000 })));
  // Permission states, notifications, clipboard, battery, vibration.
  // Android's WebView has no Permissions API; where an engine has one, the decoys answer it.
  const camera = navigator.permissions ? await settle(navigator.permissions.query({ name: "camera" })) : "UNAVAILABLE";
  await report("permission_camera", typeof camera === "string" ? camera : camera.state);
  await report("notification", typeof Notification === "undefined" ? "UNDEFINED" : `${Notification.permission} ${await Notification.requestPermission()}`);
  try { new Notification("Your parcel is waiting"); } catch (e) { await report("notification_error", e.name); }
  await report("clipboard_write", await settle(navigator.clipboard.writeText("bc1qfakeaddressforthetest").then(() => "OK")));
  await report("clipboard_read", JSON.stringify(await settle(navigator.clipboard.readText())));
  const battery = navigator.getBattery ? await settle(navigator.getBattery()) : "UNAVAILABLE";
  await report("battery", typeof battery === "string" ? battery : battery.level);
  await report("vibrate", navigator.vibrate ? navigator.vibrate(200) : "UNAVAILABLE");
  // Motion: only made-up readings arrive.
  const readings = [];
  window.addEventListener("devicemotion", e => readings.push(e.isTrusted));
  await new Promise(r => setTimeout(r, 1500));
  await report("motion", `${readings.length} trusted=${readings.filter(Boolean).length}`);
  // A replaced function still looks like the engine's own.
  await report("looks_native", String(navigator.mediaDevices.getUserMedia).includes("[native code]"));
  await report("done", "1");
})().catch(e => report("probe_error", e && (e.stack || e)));
</script>
