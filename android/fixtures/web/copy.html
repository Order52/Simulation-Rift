<!doctype html><html data-test="z1"><meta charset="utf-8"><title>Z1 copy</title>
<meta name="viewport" content="width=device-width">
<!-- Z1: a page swaps what the user copies for its own text (a command meant to be pasted elsewhere). The engine's own copy, after the user's keys, never reaches the decoys. -->
<input id="typed" style="font-size:28px;width:100%;height:100px" value="ordinary text">
<script>
const marker = new URLSearchParams(location.search).get("m") || "rift-z1";
document.addEventListener("copy", e => { e.clipboardData.setData("text/plain", marker); e.preventDefault(); });
</script>
