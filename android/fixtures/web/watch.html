<!doctype html><html data-test="w1"><meta charset="utf-8"><title>W1 page watch</title>
<meta name="viewport" content="width=device-width">
<script src="/report.js"></script>
<body>
<!-- W1: a page tries what Rift's live page watch must show. A file chooser needs a tap. -->
<button id="upload" style="font-size:28px;width:100%;height:120px" onclick="document.getElementById('file').click()">Upload a file</button>
<input type="file" id="file" style="display:none">
<!-- A host listed in the demo threat database: the proxy must refuse it (HTTPS, so it sees the host only). -->
<img src="https://listed.rift-demo.invalid/pixel.png" alt="" onload="report('known_bad', 'LOADED')" onerror="report('known_bad', 'REFUSED')">
<script>
const settle = p => p.then(() => "ALLOWED", e => "DENIED " + (e && (e.name || e.code)));
(async () => {
  await report("geolocation", await new Promise(resolve => navigator.geolocation.getCurrentPosition(
    () => resolve("ALLOWED"), e => resolve("DENIED code=" + e.code), { timeout: 5000 })));
  const media = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  await report("camera", media ? await settle(navigator.mediaDevices.getUserMedia({ video: true })) : "UNAVAILABLE");
  await report("microphone", media ? await settle(navigator.mediaDevices.getUserMedia({ audio: true })) : "UNAVAILABLE");
  // A router's address: the proxy refuses private destinations.
  await report("lan", await settle(fetch("http://192.168.1.1/", { mode: "no-cors" })));
  // WebRTC sends UDP straight to its STUN server, around the proxy: the lock drops it.
  try {
    const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:10.0.2.2:3478" }] });
    pc.createDataChannel("w1");
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(resolve => setTimeout(resolve, 3000));
    pc.close();
    await report("webrtc", "tried");
  } catch (e) {
    await report("webrtc", "FAILED " + e.name);
  }
  await report("done", "1");
})();
</script>
