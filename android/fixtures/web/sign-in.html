<!doctype html><html data-test="h3"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>H3 sign-in</title>
<!-- h3: a sign-in form, what autofill services look for. -->
<body style="background:#fff;font:20px sans-serif">
<form><p><label>User name <input id="user" name="username" autocomplete="username"></label></p>
<p><label>Password <input id="password" type="password" name="password" autocomplete="current-password"></label></p></form>
</body></html>
