[package]
name = "rift-linux"
version = "0.1.0"
description = "Simulation-Rift's Linux controller: the Qt Quick app over rift-core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "rift"
path = "src/main.rs"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
rift-channel = { path = "../../crates/rift-channel" }
rift-ffi = { path = "../../crates/rift-ffi" }
rift-protocol = { path = "../../crates/rift-protocol" }
rustix = { version = "1.1.5", features = ["net", "process"] }
# SIGTERM at logout or shutdown must destroy the session before the
# controller exits.
signal-hook = { version = "0.3.17", default-features = false, features = ["iterator"] }

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
