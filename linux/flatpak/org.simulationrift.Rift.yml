# Simulation-Rift for Linux (docs/architecture.md §9): the controller (rift)
# and the browser host (rift-browser) on the KDE runtime with Qt WebEngine.
#
# The app keeps the network for the controller's checking proxy. Each
# session's browser host runs in a `flatpak-spawn --sandbox --no-network`
# sub-sandbox: no network, no GPU and no files but its own state directory,
# which disposal deletes; the display, and the app's filtered session bus,
# through which the engine starts its sandboxed renderers.
#
# The build is offline: the crates are vendored first (see
# .github/workflows/linux-app.yml), and Cargo is told to use them only.
app-id: org.simulationrift.Rift
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.10'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rift
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/rift/cargo
modules:
  - name: rift
    buildsystem: simple
    build-commands:
      - cargo --version
      # Qt WebEngine comes from the BaseApp under /app, which the SDK's
      # qmake does not know: a wrapper presents both as one installation.
      - |
        set -eu
        sh linux/flatpak/qt-for-app.sh "$PWD/qt-for-app"
        export QMAKE="$PWD/qt-for-app/qmake"
        mkdir -p .cargo
        cp linux/vendor-config.toml .cargo/config.toml
        cargo build --offline --release --locked --manifest-path linux/Cargo.toml
        # The Linux crates' tests, in the SDK the app is built with.
        cargo test --offline --release --locked --manifest-path linux/Cargo.toml
      - install -Dm755 linux/target/release/rift /app/bin/rift
      - install -Dm755 linux/target/release/rift-browser /app/bin/rift-browser
    sources:
      # The repository root: the shared crates are path dependencies.
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - build
          - build-linux
          - target
          - android
          - fuzz
          - docs
          - poc
          - linux/target
