[package]
name = "rift-browser"
version = "0.1.0"
description = "Simulation-Rift's Linux browser host: Qt WebEngine in a no-network sub-sandbox"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The browser host links the protocol and the channel only: no rift-core,
# so no vault, session or intelligence code is mapped next to the engine.
[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
rift-channel = { path = "../../crates/rift-channel" }
rift-protocol = { path = "../../crates/rift-protocol" }

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
