[package]
name = "rift-pack"
version = "0.1.0"
description = "Maintainer tool: builds intelligence packs and publishes them as signed TUF repositories"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-lc-rs = "1.18.2" # already in the tree through tough; generates Ed25519 keys
jiff = "0.2.38"
rift-core = { path = "../../crates/rift-core" }
serde = { version = "1.0.229", features = ["derive"] } # already in the tree through tough; the root policy file
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false, features = ["rt"] }
tough = { version = "0.24.0", default-features = false }
