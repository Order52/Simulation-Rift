[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
# Phase 0 harnesses form their own workspace and never ship.
exclude = ["poc"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Order52/Simulation-Rift"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# The symbol table is most of the Android library (23 MB -> 14 MB for arm64);
# exported JNI symbols live in .dynsym and are kept.
strip = "symbols"

# Tests run passphrase wrapping at the fixed scrypt work factor (N = 2^17,
# rift_core::vault::PASSPHRASE_WORK_FACTOR); unoptimized, scrypt takes
# several seconds per call. Only the hashing crates are optimized.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
