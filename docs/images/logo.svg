    <g clip-path="url(#clip)" fill="none" stroke-linejoin="miter">
      <path d="M57,15L48,40L60,52L50,93" stroke="#2A1C70" stroke-width="9"/>
      <path d="M57,15L48,40L60,52L50,93" stroke="url(#glow)" stroke-width="3.5"/>
