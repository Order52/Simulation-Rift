<!-- Rift's launcher icon (android/bridge/src/main/res/drawable/rift_icon_*.xml) as SVG, for the README. -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1450"/>
      <stop offset="1" stop-color="#5B3FD9"/>
    </linearGradient>
    <linearGradient id="shield" x1="25" y1="17" x2="83" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD3FF"/>
    </linearGradient>
    <linearGradient id="glow" x1="54" y1="17" x2="54" y2="91" gradientUnits="userSpaceOnUse">
