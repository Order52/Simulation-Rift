name: fuzz-campaign

# Long fuzz runs (Phase 7, §22), started by hand: every target for the
# chosen number of minutes, in parallel, on Linux (the worker's targets do
# not link on macOS: ld rejects an initializer in the instrumented yara-x).
# Each job uploads its minimized corpus, its libFuzzer statistics and a
# line-coverage report for Rift's own crates; a finding fails the job and
# uploads the crashing input. Findings are fixed in the crate and kept as
# unit tests, as in the per-push fuzz job.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per target
        required: true
        default: "60"
      targets:
        description: Targets to run (a JSON list)
        required: true
        default: '["display_name","egress_head","intel_table","navigation","protocol_response","trusted_text","url_canonicalize","vault_index","worker_image","worker_scan"]'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-10-17

jobs:
  campaign:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly, llvm-tools and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component llvm-tools-preview
          cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz for ${{ inputs.minutes }} minutes
        env:
          MINUTES: ${{ inputs.minutes }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$MINUTES" in ''|*[!0-9]*) echo "minutes must be a whole number" >&2; exit 1;; esac
          mkdir -p "fuzz/corpus/$TARGET" out
          status=0
          cargo +"$NIGHTLY" fuzz run "$TARGET" -- \
            -max_total_time=$((MINUTES * 60)) -rss_limit_mb=2048 -print_final_stats=1 \
            > out/run.log 2>&1 || status=$?
          # The log without its progress lines; the whole log is uploaded.
          grep -vE '^#[0-9]+\s+(NEW|REDUCE|pulse|INITED)' out/run.log | tail -n 80
          exit "$status"
      - name: Minimize the corpus and measure coverage
        if: success()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo +"$NIGHTLY" fuzz cmin "$TARGET" 2>&1 | tail -3
          cargo +"$NIGHTLY" fuzz coverage "$TARGET" 2>&1 | tail -3
          host="$(rustc +"$NIGHTLY" -vV | sed -n 's/^host: //p')"
          llvm_cov="$(rustc +"$NIGHTLY" --print sysroot)/lib/rustlib/$host/bin/llvm-cov"
          # cargo fuzz coverage builds under target/ of the directory it runs
          # in (here the repository root), not under fuzz/target.
          "$llvm_cov" report "target/$host/coverage/$host/release/$TARGET" \
            -instr-profile="fuzz/coverage/$TARGET/coverage.profdata" \
            -ignore-filename-regex='(\.cargo|rustc)/' > out/coverage.txt
          cat out/coverage.txt
          tar -czf out/corpus.tar.gz -C fuzz/corpus "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            out/
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
