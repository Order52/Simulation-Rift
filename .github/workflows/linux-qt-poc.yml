name: linux-qt-poc

# Phase 5 PoCs for the Qt design (docs/reports/phase-5-qt-design.md): Qt
# WebEngine from Flathub's BaseApp in a real Flatpak on Ubuntu, probed from
# the host. Runs when the PoC changes, or by hand.

on:
  workflow_dispatch:
  push:
    # Branches only: GitHub ignores path filters on tag pushes, so without
    # this every release tag started the PoCs.
    branches: [main]
    paths:
      - poc/linux-qt/**
      - .github/workflows/linux-qt-poc.yml

permissions:
  contents: read

jobs:
  q1-sandbox:
    name: Q1 Qt WebEngine sandbox in Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flatpak tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder xvfb dbus
          flatpak --version
          echo "unprivileged user namespaces restricted by AppArmor: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the probe Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --install --force-clean \
            --disable-rofiles-fuse build poc/linux-qt/org.simulationrift.QtProbe.yml 2>&1 | tail -20
          flatpak info --user org.simulationrift.QtProbe
          flatpak info --user io.qt.qtwebengine.BaseApp//6.10 | head -12 || true
      - name: Run the probe
        run: |
          mkdir -p out
          { uname -a; flatpak --version; flatpak list --user; } > out/environment.txt
          s=0
          dbus-run-session -- xvfb-run -a sh poc/linux-qt/run-ci.sh out || s=$?
          cat out/summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit $s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-qt-q1
          path: out/
          if-no-files-found: ignore

  q2-network-lock:
    name: Q2 Qt WebEngine in a no-network sub-sandbox (L4)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flatpak tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder xvfb dbus
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the network-lock Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --install --force-clean \
            --disable-rofiles-fuse build-q2 poc/linux-qt/q2-netlock/org.simulationrift.QtNetLock.yml 2>&1 | tail -20
          flatpak info --user org.simulationrift.QtNetLock
      - name: Run both cases
        run: |
          mkdir -p out
          { uname -a; flatpak --version; flatpak list --user; } > out/environment.txt
          s=0
          # Xvfb first: the session bus, and the Flatpak portal it starts, must
          # know DISPLAY, or the portal gives the sub-sandbox no X socket.
          xvfb-run -a dbus-run-session -- sh poc/linux-qt/q2-netlock/run-ci.sh out || s=$?
          cat out/summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit $s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-qt-q2
          path: out/
          if-no-files-found: ignore

  q4-worker-lockdown:
    name: Q4 worker lockdown inside Flatpak (L2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain and Flatpak
        run: |
          rustup show active-toolchain || rustup toolchain install
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # The runtime the KDE 6.10 runtime is built on: the same bwrap and
          # seccomp setup as the app's own sandbox.
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08
      - name: Build
        working-directory: poc
        run: cargo build --release --locked -p linux-worker-lockdown
      - name: Run all modes inside a Flatpak sandbox
        run: |
          mkdir -p out
          bin="$PWD/poc/target/release"
          status=0
          for mode in none fd-only ro-dir strict; do
            echo "## mode $mode" | tee -a out/q4.txt
            s=0
            flatpak run --user --filesystem="$bin:ro" --command="$bin/linux-worker-lockdown" \
              org.freedesktop.Platform//25.08 controller --mode "$mode" > out/mode.txt 2>&1 || s=$?
            cat out/mode.txt | tee -a out/q4.txt
            echo "exit status $s" | tee -a out/q4.txt
            [ $s -eq 0 ] || status=1
          done
          # The sandbox the modes ran in, for the record.
          flatpak run --user --command=sh org.freedesktop.Platform//25.08 -c \
            'grep -E "^(Seccomp|NoNewPrivs)" /proc/self/status; ls -l /proc/self/ns' >> out/q4.txt 2>&1
          cat out/q4.txt >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-qt-q4
          path: out/
          if-no-files-found: ignore

  q3-cxx-qt:
    name: Q3 cxx-qt QML app over rift-core in the KDE SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flatpak tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the probe Flatpak
        run: |
          mkdir -p out
          start=$(date +%s)
          flatpak-builder --user --install-deps-from=flathub --install --force-clean \
            --disable-rofiles-fuse build-q3 poc/linux-qt/q3-cxx-qt/org.simulationrift.QtCoreProbe.yml \
            > out/build.log 2>&1 || { tail -60 out/build.log; exit 1; }
          echo "flatpak-builder seconds (SDK download included): $(( $(date +%s) - start ))" | tee out/size.txt
          grep -E "^(cargo |    Finished|   Compiling rift-core)" out/build.log | tee -a out/size.txt
          ls -l build-q3/files/bin/rift-qt-core-probe | tee -a out/size.txt
          flatpak run --user --command=sh org.simulationrift.QtCoreProbe -c \
            'ldd /app/bin/rift-qt-core-probe | grep -i qt' | tee -a out/size.txt
      - name: Run the self-test
        run: |
          s=0
          flatpak run --user --env=QT_QPA_PLATFORM=offscreen org.simulationrift.QtCoreProbe \
            > out/run.txt 2>&1 || s=$?
          cat out/run.txt
          echo "exit status $s"
          grep -o "q3: .*" out/run.txt > out/answers.txt || true
          diff -u poc/linux-qt/q3-cxx-qt/expected.txt out/answers.txt
          [ $s -eq 0 ]
          { cat out/size.txt; cat out/answers.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-qt-q3
          path: out/
          if-no-files-found: ignore
