name: dependabot auto-merge

# Turns on auto-merge for Dependabot's pull requests: GitHub merges each one
# when every required check (ci.yml, on main's branch protection) has passed,
# and never if one fails. Versions are at least 7 days old (dependabot.yml).
on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge once the checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
