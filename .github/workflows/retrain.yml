name: retrain rift ai

# Monthly: retrains Rift AI on that day's feeds (tools/rift-train/retrain.sh)
# and, if the new model passes the gate (tools/rift-train/gate.py) and the
# shipped-model tests, opens a pull request with it that merges itself once
# CI passes; the next weekly release (release.yml) ships it. The feeds
# themselves are never committed.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings. A pull request opened with GITHUB_TOKEN
# does not start other workflows, so this one starts CI on its branch by
# workflow_dispatch.
#
# Rift AI keeps what it learned: the phishing pages of every month (up to
# 24 months back, tools/rift-train/memory.py) are kept as this workflow's
# "rift-ai-memory" artifact, which each run takes from the last one and
# hands on, whether or not its model passes the gate. Artifacts last 90
# days: after three months with no successful run the memory starts again
# from that month's feeds. The GitHub sample of hosting-platform sites
# needs RIFT_SEARCH_TOKEN (a token with no permissions, for code search);
# without it the model trains without that sample, and the PR says so.
on:
  schedule:
    - cron: "17 3 1 * *"
    # Rift AI's page memory gains the newest phishing pages twice a day,
    # as OpenPhish's feed changes; they stay up for hours or days.
    - cron: "41 5,17 * * *"
  workflow_dispatch:
    inputs:
      models:
        description: Which model to retrain
        type: choice
        options: [all, address, pages, brands, collect]
        default: all

permissions:
  contents: read

jobs:
  retrain:
    if: github.event.schedule == '17 3 1 * *' || inputs.models == 'all' || inputs.models == 'address'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Keep the shipped model's report
        run: cp models/url-model.json "$RUNNER_TEMP/shipped.json"
      - name: Take the memory the last run left
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/rift-train/take_memory.sh rift-ai-memory "$RUNNER_TEMP/memory" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retrain on today's feeds and the memory
        env:
          GH_TOKEN: ${{ secrets.RIFT_SEARCH_TOKEN }}
          RIFT_AI_MEMORY: ${{ runner.temp }}/memory/memory.tsv
        shell: bash  # pipefail, as for the gate
        run: sh tools/rift-train/retrain.sh "$RUNNER_TEMP/feeds" "$RUNNER_TEMP/prepared" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Hand the memory on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rift-ai-memory
          path: ${{ runner.temp }}/memory/memory.tsv
          retention-days: 90
          if-no-files-found: error
      - name: Gate
        shell: bash  # pipefail: a failed gate must fail the step, not be hidden by tee
        run: python3 -I tools/rift-train/gate.py "$RUNNER_TEMP/shipped.json" models/url-model.json tools/rift-train/baseline.json | tee "$RUNNER_TEMP/gate.txt"
      - name: The shipped-model tests still hold
        run: "cargo test --locked -p rift-ffi ai::"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="retrain/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add models/url-model.bin models/url-model.json
          git commit -m "models: retrain rift ai on the $(date -u +%Y-%m-%d) feeds"
          git push origin "$branch"
          {
            echo "Rift AI retrained on today's feeds and its memory of earlier months by the monthly workflow; it passed the gate and \`cargo test -p rift-ffi ai::\`. Merges itself when CI passes."
            echo
            echo '```'
            cat "$RUNNER_TEMP/gate.txt"
            echo '```'
            [ -s "$RUNNER_TEMP/prepared/github-platforms.txt" ] || echo "Trained without the GitHub sample of hosting-platform sites (no RIFT_SEARCH_TOKEN)."
            echo
            echo "docs/reports/rift-ai.md and url-model-notice.txt keep the figures of the last hand-checked training; the gate's figures above are this model's."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --title "models: retrain rift ai ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/body.md"
          gh pr merge --auto --squash "$branch"
          gh workflow run ci.yml --ref "$branch"

  # Rift AI's page memory (docs/reports/page-model.md, "Learning from new
  # pages"): the newest phishing pages and some ordinary ones, fetched as
  # HTML, counted and deleted; only the counts are kept, as an artifact.
  collect-pages:
    if: github.event.schedule == '41 5,17 * * *' || inputs.models == 'collect'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: rift-page-memory
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: The newest Common Crawl collection
        id: crawl
        run: echo "id=$(curl -fsSL --retry 3 https://index.commoncrawl.org/collinfo.json | python3 -I -c 'import json, sys; print(json.load(sys.stdin)[0]["id"])')" >> "$GITHUB_OUTPUT"
      - name: Its sample of ordinary pages, made once per collection
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ordinary
          key: ordinary-pages-${{ steps.crawl.outputs.id }}
      - name: Take the page memory
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/rift-train/take_memory.sh rift-page-memory "$RUNNER_TEMP/memory" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Add the newest pages
        shell: bash  # pipefail: a failed collection must fail the step, not be hidden by grep
        run: |
          mkdir -p "$RUNNER_TEMP/ordinary"
          sh tools/rift-train/retrain_pages.sh collect "$RUNNER_TEMP/pages" "$RUNNER_TEMP/memory/page-memory.tsv" "$RUNNER_TEMP/ordinary/cc-pages.txt" \
            | grep -E '^(phishing:|legitimate:|Page memory)' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Hand the page memory on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rift-page-memory
          path: ${{ runner.temp }}/memory/page-memory.tsv
          retention-days: 90
          if-no-files-found: error

  # Rift AI's page model, monthly: the 2021 dataset and the page memory, as
  # counts; a pull request only if the gate passes.
  pages:
    if: github.event.schedule == '17 3 1 * *' || inputs.models == 'all' || inputs.models == 'pages'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Take the page memory
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/rift-train/take_memory.sh rift-page-memory "$RUNNER_TEMP/memory" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retrain on the 2021 dataset and the memory, and gate
        shell: bash  # pipefail: the gate's refusal must fail the step, not be hidden by tee
        run: |
          sh tools/rift-train/retrain_pages.sh train "$RUNNER_TEMP/pages" "$RUNNER_TEMP/memory/page-memory.tsv" 2>&1 | tee "$RUNNER_TEMP/pages.txt"
      - name: What the gate saw
        if: always()
        run: grep -E '^(2021 dataset|Page memory|test |recent |shipped |refused|  |passed)' "$RUNNER_TEMP/pages.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - name: The shipped-model tests still hold
        run: "cargo test --locked -p rift-core pagemodel:: && cargo test --locked -p rift-ffi"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="retrain-pages/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add models/page-model.txt
          git commit -m "models: retrain rift ai's page model on the $(date -u +%Y-%m-%d) page memory"
          git push origin "$branch"
          {
            echo "Rift AI's page model retrained on the 2021 dataset and its memory of recent pages by the monthly workflow; it passed the gate and the shipped-model tests. Merges itself when CI passes."
            echo
            echo '```'
            grep -E '^(2021 dataset|Page memory|test |recent |shipped |passed)' "$RUNNER_TEMP/pages.txt"
            echo '```'
            echo
            echo "docs/reports/page-model.md keeps the figures of the last hand-checked training; the figures above are this model's."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --title "models: retrain rift ai's page model ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/body.md"
          gh pr merge --auto --squash "$branch"
          gh workflow run ci.yml --ref "$branch"

  # The brands Check protects (architecture §10.3): relearned from today's
  # feeds; a pull request only if the gate passes and the list changed.
  brands:
    if: github.event.schedule == '17 3 1 * *' || inputs.models == 'all' || inputs.models == 'brands'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: A dictionary, to leave out ordinary words
        run: sudo apt-get install -y --no-install-recommends wamerican
      - name: Relearn the brands and gate them
        shell: bash  # pipefail: a refusal must fail the step, not be hidden by tee
        run: sh tools/rift-train/retrain_brands.sh "$RUNNER_TEMP/brands" /usr/share/dict/words | tee "$RUNNER_TEMP/brands.txt" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The shipped-brand tests still hold
        run: "cargo test --locked -p rift-core heuristics:: && cargo test --locked -p rift-ffi"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- models/brands.txt; then echo "The brand list is unchanged."; exit 0; fi
          branch="brands/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add models/brands.txt
          git commit -m "models: relearn the brands check protects from the $(date -u +%Y-%m-%d) feeds"
          git push origin "$branch"
          {
            echo "The brands Check protects, relearned from today's feeds by the monthly workflow; the list passed the gate and the shipped-brand tests. Merges itself when CI passes."
            echo
            echo '```'
            cat "$RUNNER_TEMP/brands.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --title "models: relearn the protected brands ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/body.md"
          gh pr merge --auto --squash "$branch"
          gh workflow run ci.yml --ref "$branch"
