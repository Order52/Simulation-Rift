name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Phase 0 evidence on a real x86_64 distribution kernel (PoC L2/L3).
  linux-worker-lockdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        working-directory: poc
        run: cargo build --release --locked -p linux-worker-lockdown
      - name: Kernel and LSM information
        run: |
          uname -a
          cat /sys/kernel/security/lsm || true
      - name: Run all modes (unprivileged)
        working-directory: poc
        run: |
          status=0
          for mode in none fd-only ro-dir strict; do
            ./target/release/linux-worker-lockdown controller --mode "$mode" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit $status

  # Phase 1 gate: every fuzz target runs for a fixed budget on each push.
  # Findings are fixed in the crate and kept as unit tests, not as corpus files.
  fuzz:
    runs-on: ubuntu-latest
    env:
      NIGHTLY: nightly-2026-10-17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - name: Run each target for 60 seconds
        run: |
          for target in $(cargo +"$NIGHTLY" fuzz list); do
            echo "::group::$target"
            cargo +"$NIGHTLY" fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done
