name: ci

# Pushes that cannot affect a build or test (documentation, screenshots,
# evidence, and workflows other than this one) do not start CI again; the
# release workflow (release.yml) compares against this list, keep both in
# step. Pull requests always run everything: auto-merge waits for these
# checks. workflow_dispatch: the release and update workflows start CI on
# commits their own token pushed, which start nothing by themselves.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - poc/**
      - linux/**
      - .github/dependabot.yml
      - .github/scripts/bump_toolchains.py
      - .github/scripts/kev_update.py
      - .github/workflows/caretaker.yml
      - fastlane/**
      - .github/workflows/dependabot-automerge.yml
      - .github/workflows/fuzz-campaign.yml
      - .github/workflows/kev.yml
      - .github/workflows/linux-app.yml
      - .github/workflows/linux-qt-poc.yml
      - .github/workflows/release.yml
      - .github/workflows/retrain.yml
      - .github/workflows/toolchains.yml
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The declared rust-version: the compiler the Linux Flatpak builds with.
  msrv:
    runs-on: ubuntu-latest
    env:
      MSRV: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +"$MSRV" check --workspace --all-targets --locked

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # The Android libraries on every module's runtime classpaths (from the
      # gradle.lockfiles) against OSV's advisories; android/scan-dependencies.sh
      # says what is left out. A pinned release, checked against the SHA-256
      # it was published with.
      - name: Scan the Android libraries (OSV-Scanner)
        env:
          OSV_SCANNER_VERSION: v2.6.0
          OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          sh android/scan-dependencies.sh "$RUNNER_TEMP/osv-scanner"

  # Phase 0 evidence on a real x86_64 distribution kernel (PoC L2/L3).
  linux-worker-lockdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        working-directory: poc
        run: cargo build --release --locked -p linux-worker-lockdown
      - name: Kernel and LSM information
        run: |
          uname -a
          cat /sys/kernel/security/lsm || true
      - name: Run all modes (unprivileged)
        working-directory: poc
        run: |
          status=0
          for mode in none fd-only ro-dir strict; do
            ./target/release/linux-worker-lockdown controller --mode "$mode" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit $status

  # Phase 1 gate: every fuzz target runs for a fixed budget on each push.
  # Findings are fixed in the crate and kept as unit tests, not as corpus files.
  fuzz:
    runs-on: ubuntu-latest
    env:
      NIGHTLY: nightly-2026-10-17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - name: Run each target for 60 seconds
        run: |
          for target in $(cargo +"$NIGHTLY" fuzz list); do
            echo "::group::$target"
            cargo +"$NIGHTLY" fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048
            echo "::endgroup::"
          done

  # Device matrix: the full Android suite (android/run-tests.sh: controller,
  # browser app and outsider test app, network lock included) on
  # x86_64 emulators, which Apple Silicon machines cannot run. KVM makes them
  # hardware accelerated on GitHub's Linux runners.
  android-emulator:
    name: android (API ${{ matrix.api-level }}, x86_64)
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 29.0.14206865
      EVIDENCE: ${{ github.workspace }}/evidence/phase3-android-api${{ matrix.api-level }}-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain, Android targets and cargo-ndk
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Build (both ABIs, 16 KB alignment check)
        run: sh android/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the suite on the emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell input keyevent 82
            sh android/run-tests.sh "$EVIDENCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: phase3-android-api${{ matrix.api-level }}-x86_64
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
      - name: Every test passed
        run: |
          cat "$EVIDENCE/device.txt" "$EVIDENCE/instrumented-results.txt" "$EVIDENCE/host-results.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          # The run finished (a failure that passed on its retry leaves "Tests run:", not "OK").
          grep -qE "^(OK \(|Tests run:)" "$EVIDENCE/instrumentation.txt"
          ! grep -q FAIL "$EVIDENCE/instrumented-results.txt" "$EVIDENCE/host-results.txt"
