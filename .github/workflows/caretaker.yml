name: caretaker

# Does what would otherwise need someone to look after the repository:
# - A CI run that fails is run again once (only its failed jobs), so one
#   flaky emulator test does not hold back a merge or a release.
# - Weekly: GitHub turns scheduled workflows off after 60 days without
#   activity; this turns every workflow on again, which restarts that count.
# - Weekly: a bot's pull request that failed CI and is behind main is
#   rebased onto main so CI runs again (it may have failed on a main
#   that has since been fixed).
# - Every 6 hours: GitHub holds the pull_request runs on a branch a bot
#   pushed ("action_required") until someone approves them, and branch
#   protection counts only those runs. This approves held runs on this
#   repository's own branches pushed by this repository's bots (never a
#   fork's), so their pull requests can merge themselves.
# - Weekly: a monthly bot pull request (retrain/, toolchains/, kev/) that
#   is still open after 40 days is closed; a newer one has replaced it.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: "47 2 * * 1"
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  retry:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the failed jobs once more
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"

  approve:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Approve held runs on the bots' own branches
        run: |
          gh api "repos/$GH_REPO/actions/runs?status=action_required&per_page=100" \
            --jq ".workflow_runs[] | select(.head_repository.full_name == \"$GH_REPO\") | select(.actor.login == \"github-actions[bot]\" or .actor.login == \"dependabot[bot]\") | .id" |
          while read -r id; do
            gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve"
            echo "Approved run $id." >> "$GITHUB_STEP_SUMMARY"
          done

  tend:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 2 * * 1'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep the scheduled workflows on
        run: |
          for id in $(gh api "repos/$GH_REPO/actions/workflows" --paginate --jq '.workflows[] | select(.path | startswith(".github/workflows/")) | .id'); do
            gh api -X PUT "repos/$GH_REPO/actions/workflows/$id/enable"
          done
      - name: Rebase bot pull requests that failed on an older main
        run: |
          gh pr list --state open --json number,author,statusCheckRollup \
            --jq '.[] | select(.author.is_bot) | select([.statusCheckRollup[] | .conclusion] | index("FAILURE")) | "\(.number) \(.author.login)"' |
          while read -r number author; do
            # Dependabot stops rebasing a pull request someone else pushed
            # to, so it is asked to recreate its own instead.
            if [ "$author" = "app/dependabot" ]; then
              gh pr comment "$number" --body "@dependabot recreate"
              echo "Asked Dependabot to recreate #$number." >> "$GITHUB_STEP_SUMMARY"
            # Fails, and nothing more happens, when the branch is already on main.
            # The new CI run is held; the next approve run lets it go.
            elif gh pr update-branch "$number" --rebase; then
              echo "Rebased #$number." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Close monthly bot pull requests a newer one replaced
        run: |
          cutoff="$(date -u -d '40 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh pr list --state open --json number,headRefName,createdAt \
            --jq ".[] | select(.headRefName | test(\"^(retrain|toolchains|kev)/\")) | select(.createdAt < \"$cutoff\") | .number" |
          while read -r number; do
            gh pr close "$number" --delete-branch --comment "Closed by the caretaker: open for 40 days, and a newer run has replaced it."
          done
