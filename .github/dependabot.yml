# Weekly dependency updates, merged by themselves once CI passes
# (.github/workflows/dependabot-automerge.yml) and shipped in the next weekly
# release (release.yml). The cooldown takes only versions published at least
# 7 days earlier, by which time most hijacked releases have been found and
# pulled; security updates do not wait.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      android:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
