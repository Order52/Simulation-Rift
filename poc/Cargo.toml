# Phase 0 feasibility harnesses. These are evidence tools, not product code:
# they are kept so every Phase 0 result in docs/reports/ is reproducible, and
# they are deleted once the product implementation supersedes them.
[workspace]
resolver = "3"
members = ["android-native", "linux-worker-lockdown", "tuf-offline"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# The Docker VM used for Linux PoCs is memory-constrained; an opt-level=3
# build of cranelift-codegen gets OOM-killed there. Lower optimization only
# changes build memory and speed, not the confinement behaviour under test.
[profile.release.package.cranelift-codegen]
opt-level = 1
