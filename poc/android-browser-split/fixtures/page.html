<!doctype html>
<meta charset="utf-8">
<title>split PoC</title>
<p id="out">running</p>
<script>
// What a page (no escape) can reach: session state left by an earlier
// session, private and loopback addresses, and UDP through WebRTC.
(async () => {
  const run = new URLSearchParams(location.search).get('run');
  const r = {run, cookie_before: document.cookie || 'none', storage_before: localStorage.getItem('rift') || 'none'};
  document.cookie = 'rift=' + run + '; max-age=86400; path=/';
  localStorage.setItem('rift', run);
  async function probe(name, url) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 4000);
    try {
      await fetch(url + '?run=' + run, {mode: 'no-cors', cache: 'no-store', signal: c.signal});
      r[name] = 'FETCHED';
    } catch (e) {
      r[name] = 'FAILED ' + e.name;
    }
    clearTimeout(t);
  }
  await probe('lan', 'http://10.0.2.2:8780/lan-probe');
  await probe('loopback', 'http://127.0.0.1:8780/loopback-probe');
  try {
    const pc = new RTCPeerConnection({iceServers: [{urls: 'stun:10.0.2.2:3478'}]});
    const types = [];
    pc.onicecandidate = e => { if (e.candidate) types.push(e.candidate.type + ':' + (e.candidate.address || '?')); };
    pc.createDataChannel('x');
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(res => setTimeout(res, 4000));
    r.webrtc = 'candidates ' + (types.join(' ') || 'none');
    pc.close();
  } catch (e) {
    r.webrtc = 'FAILED ' + e.name;
  }
  document.getElementById('out').textContent = JSON.stringify(r);
  await fetch('/report', {method: 'POST', body: JSON.stringify(r)});
})();
</script>
